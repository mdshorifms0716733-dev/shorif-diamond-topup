<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel — Shorif Diamond Topup Center BD</title><link rel="stylesheet" href="style.css"></head><body><main class="section"><div id="loginCard" class="formCard"><span class="badge">SECURE ADMIN</span><h2>👑 Admin Login</h2><p class="muted">শুধু অনুমোদিত Admin account-এর জন্য।</p><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button class="primary full" id="login">Login</button><div id="loginMsg"></div></div><div id="panel" class="hidden"><div class="formCard"><div class="sectionHead"><div><span class="badge">ADMIN PANEL</span><h2>⚙️ Dashboard</h2><p id="who" class="muted"></p></div><div><a class="secondary" href="index.html">Website</a> <button class="secondary" id="logout">Logout</button></div></div><div id="panelMsg"></div><div class="steps"><div><b>📦 Packages</b><small>Add/Edit/Activate/Deactivate</small></div><div><b>📋 Orders</b><small>Payment যাচাই ও Status</small></div><div><b>👥 Players</b><small>User list & profiles</small></div></div></div><div class="formCard"><h2>📦 Manage Packages</h2><div id="packageEditor"></div><button class="secondary" id="addPackage">＋ Add Package</button></div><div class="formCard"><h2>📋 Orders</h2><div id="orders">Loading...</div></div><div class="formCard"><h2>⚙️ Website Settings</h2><div class="two"><label>Site Name<input id="siteName"></label><label>Payment bKash<input id="payment"></label><label>Nagad<input id="nagad"></label><label>WhatsApp<input id="whatsapp"></label><label>Support Email<input id="supportEmail"></label></div><label>Notice Text<textarea id="noticeText" rows="3"></textarea></label><button class="primary" id="saveSettings">💾 Save Settings</button></div><div class="formCard"><h2>🖼️ Admin Photo</h2><img id="adminPhoto" src="assets/owner.png" style="width:130px;height:130px;object-fit:cover;border-radius:18px;border:2px solid #168bd7"><label>Change Photo<input id="adminPhotoFile" type="file" accept="image/*"></label><button class="primary" id="uploadAdminPhoto">Upload / Change Photo</button></div><div class="formCard"><h2>🔐 Change Password</h2><label>New Password<input id="newPassword" type="password" minlength="8"></label><button class="primary" id="changePassword">Change Password</button></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
